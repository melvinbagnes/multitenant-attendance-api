name: bootstrap
on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap.yml"]
permissions:
  contents: write
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project archive
        run: |
          tar -xzf project.tgz
          rm project.tgz
      - name: Commit project files
        run: |
          git config user.name "Melvin Bagnes"
          git config user.email "melvinbagnes@users.noreply.github.com"
          git add -A
          git commit -m "Add multi-tenant attendance API"
          git push
