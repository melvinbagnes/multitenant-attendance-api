services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Development enables the demo-only POST /dev/token endpoint.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=attendance;Username=postgres;Password=postgres
      Jwt__SigningKey: compose-demo-signing-key-change-me-0123456789
    ports:
      - "8080:8080"
